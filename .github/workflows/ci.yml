# Standalone for now — will be replaced by a stub calling the reusable
# workflow from sebastian-software/.github once that repository exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      # `.standards/blocked.json` records an agent run that pushed a result it
      # could not validate. `blocking: true` is the CLI/stamp alignment class:
      # every verdict of that run was computed against the wrong manifest, so
      # the pull request must not merge. A non-blocking marker is context for
      # the reviewer - the failures it lists are reported by this workflow's own
      # lanes. The marker is parsed rather than matched line by line: JSON may
      # put `"blocking":` and `true` on separate lines, and a guard whose whole
      # purpose is to fail closed must fail on a marker it cannot read at all.
      # `node` rather than `jq`, which the Forgejo node image may lack; the
      # schema is `BlockedState` in @sebastian-software/standards.
      - name: "Guard: no blocking agent findings for this PR"
        run: |
          node -e "
          const { existsSync, readFileSync } = require('node:fs');
          const file = '.standards/blocked.json';
          if (!existsSync(file)) { process.exit(0); }
          const raw = readFileSync(file, 'utf8');
          console.log(raw);
          const fail = (detail) => { console.error('Refusing to pass ' + file + ': ' + detail); process.exit(1); };
          let state;
          try { state = JSON.parse(raw); } catch (error) { fail('it is not valid JSON - ' + error.message); }
          if (typeof state !== 'object' || state === null || Array.isArray(state)) { fail('it is not a JSON object.'); }
          const orNull = (value, type) => value === null || typeof value === type;
          const broken = [
            ['schemaVersion must be 1', state.schemaVersion !== 1],
            ['blocking must be a boolean', typeof state.blocking !== 'boolean'],
            ['reason must be a string', typeof state.reason !== 'string'],
            ['detectedAt must be a string', typeof state.detectedAt !== 'string'],
            ['expectedStandardsVersion must be a number', typeof state.expectedStandardsVersion !== 'number'],
            ['observedStandardsVersion must be a number or null', !orNull(state.observedStandardsVersion, 'number')],
            ['expectedCliVersion must be a string or null', !orNull(state.expectedCliVersion, 'string')],
            ['observedCliVersion must be a string or null', !orNull(state.observedCliVersion, 'string')],
            ['failedChecks must be an array of strings', !Array.isArray(state.failedChecks) || !state.failedChecks.every((entry) => typeof entry === 'string')],
            ['retry must be a string', typeof state.retry !== 'string'],
          ].filter((entry) => entry[1]).map((entry) => entry[0]);
          if (broken.length > 0) { fail('it does not match the documented schema - ' + broken.join('; ')); }
          if (state.blocking) { fail('the agent could not validate its result.'); }
          console.log('The agent marker is non-blocking; its findings are reviewer context.');
          "

      # The pinned CLI has to ship the manifest version this repository is
      # stamped at. Below the stamp, every `standards check` verdict is computed
      # against an outdated manifest, and `check` reports that as a blocking
      # finding rather than as drift. `require.resolve` also searches the
      # directories declared in `.repometa.json#workspaces`, so a devDependency
      # installed in a nested workspace is found too. The same directories are
      # then read for the pin itself: every package.json that declares the CLI
      # must declare a bare exact version literal, and at least one must declare
      # it - a range, tag, alias or `catalog:` reference cannot be raised to a
      # release. Like the CLI, the literal also stays within npm's limits - at
      # most 256 characters, and a major, minor and patch no greater than
      # Number.MAX_SAFE_INTEGER - because npm resolves a longer or larger one as
      # a mutable dist-tag. This also catches a CLI too old to report the pin
      # shape itself.
      # Deliberately simpler than the CLI and a superset of it: the guard reads
      # the raw `workspaces` list without the CLI's symlink and normalization
      # checks, and exempts the CLI's own repository by the literal package name.
      # A shown specifier keeps only the scheme of a URL, and every control
      # character becomes `?`, so a declared value cannot inject a log line.
      # `node -p` rather than `jq`, which the Forgejo node image may lack.
      - name: "Guard: the pinned standards CLI matches the repository stamp"
        run: |
          node -p "
          const meta = require('./.repometa.json');
          const paths = [process.cwd(), ...(meta.workspaces ?? [])];
          const manifest = require(require.resolve('@sebastian-software/standards/manifest.json', { paths }));
          if (manifest.currentVersion !== meta.standards) {
            throw new Error('The installed @sebastian-software/standards ships manifest version ' + manifest.currentVersion + ', but .repometa.json is stamped ' + meta.standards + '. Raise the pin to the release whose manifest is version ' + meta.standards + ' and refresh the lockfile.');
          }
          const { readFileSync } = require('node:fs');
          const { join, relative } = require('node:path');
          const cli = '@sebastian-software/standards';
          const isRecord = (value) => typeof value === 'object' && value !== null && !Array.isArray(value);
          const units = paths.flatMap((dir) => {
            const file = join(dir, 'package.json');
            try { const pkg = JSON.parse(readFileSync(file, 'utf8')); return isRecord(pkg) ? [{ file: relative(process.cwd(), file), pkg }] : []; } catch { return []; }
          });
          const exact = (spec) => typeof spec === 'string' && /^(?:0|[1-9][0-9]*)[.](?:0|[1-9][0-9]*)[.](?:0|[1-9][0-9]*)(?:-(?:[0-9]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*)(?:[.](?:[0-9]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*))*)?(?:[+][0-9A-Za-z-]+(?:[.][0-9A-Za-z-]+)*)?/.exec(spec)?.[0] === spec && spec.length <= 256 && spec.split(/[+-]/, 1)[0].split('.').every((part) => Number(part) <= Number.MAX_SAFE_INTEGER);
          const shown = (spec) => {
            const text = typeof spec === 'string' ? spec : JSON.stringify(spec);
            const reduced = text.includes('://') ? text.slice(0, text.indexOf('://') + 1) : text;
            return [...reduced].map((char) => { const code = char.charCodeAt(0); return code < 32 || (code >= 127 && code < 160) ? '?' : char; }).join('');
          };
          const declared = units.flatMap((unit) => [unit.pkg.devDependencies, unit.pkg.dependencies].filter((deps) => isRecord(deps) && Object.hasOwn(deps, cli)).map((deps) => ({ file: unit.file, spec: deps[cli] })));
          const exempt = units.some((unit) => unit.pkg.name === cli);
          const loose = exempt ? [] : declared.filter((entry) => !exact(entry.spec));
          if (loose.length > 0) {
            throw new Error(loose.map((entry) => entry.file + ' declares ' + cli + ' as ' + shown(entry.spec)).join('; ') + ' - the pin must be a bare exact version literal such as 0.11.1. Set its value to an exact version in that package.json and dependency field (install with pnpm add --save-exact @sebastian-software/standards@<version>, adding --save-dev for a devDependency), and refresh the lockfile.');
          }
          if (!exempt && units.length > 0 && declared.length === 0) {
            throw new Error('No package.json declares ' + cli + ', but this workflow runs it. Add @sebastian-software/standards@<version> as a devDependency pinned to a bare exact version literal in the package.json this job installs from, and refresh the lockfile.');
          }
          'standards CLI and repository stamp are aligned at version ' + meta.standards + ', and the pin is an exact version literal'
          "
      - run: pnpm agent:check
